services:
  crm-pulse-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - profile_logs:/app/logs
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8088"
      AGENT_MODE: proxy
      AGENT_BASE_URL: http://agent-service:8091
      RDF_URL: ${RDF_URL_DOCKER:-http://host.docker.internal:7200}
    ports:
      - "127.0.0.1:${CRM_PULSE_MONITOR_PORT:-8088}:8088"
    depends_on:
      - agent-service
    networks:
      - rdf_store

  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - profile_logs:/app/logs
    env_file:
      - .env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8091"
      AGENT_CORS_ALLOW_ORIGINS: http://127.0.0.1:8088
      MCP_HOST: mcp-graphdb
      MCP_PORT: "8090"
      RDF_URL: ${RDF_URL_DOCKER:-http://host.docker.internal:7200}
    command: ["python", "agent_service.py"]
    ports:
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8091}:8091"
    depends_on:
      - mcp-graphdb
    networks:
      - rdf_store

  mcp-graphdb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - profile_logs:/app/logs
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8090"
      RDF_URL: ${RDF_URL_DOCKER:-http://host.docker.internal:7200}
    command: ["python", "-m", "mcp.mcp_server"]
    ports:
      - "127.0.0.1:${MCP_SERVER_PORT:-8090}:8090"
    networks:
      - rdf_store

networks:
  rdf_store:
    external: true
    name: ${RDF_DOCKER_NETWORK:-graphdb_default}

volumes:
  profile_logs:
