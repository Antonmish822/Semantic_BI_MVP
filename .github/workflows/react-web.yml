name: React web

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run test:e2e -- --workers=2
        env:
          PLAYWRIGHT_COMPARE_SCREENSHOTS: '1'
      - run: uv run --directory backend --locked python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results/
