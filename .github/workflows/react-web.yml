name: Semantic BI CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      RDF_URL: http://127.0.0.1:1
      ONTOLOGY_AUTO_PUBLISH_BUILTINS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.10'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check Python syntax
        run: uv run --locked python -m compileall -q . -x '/\.venv/'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web assets required by gateway contract tests
        working-directory: .
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Run backend and contract tests
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check dev deployment receiver
        working-directory: .
        run: uv run --directory backend --locked python -m unittest discover -s deploy/dev/tests -v

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run test:e2e -- --workers=2
        env:
          PLAYWRIGHT_COMPARE_SCREENSHOTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results/

  containers:
    name: Build application containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CRM_MONITOR_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate isolated dev configuration
        env:
          DEV_RELEASE_SHA: ${{ github.sha }}
        run: docker compose --env-file .env.example -f compose.yaml -f deploy/dev/compose.override.yaml config --quiet
      - name: Build all application services
        run: docker compose --env-file .env.example build
      - name: Check the dev image archive
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          bash deploy/dev/build.sh
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('receive', 'deploy/dev/receive.py')
          receiver = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(receiver)
          archive = Path('images.tar.gz')
          receiver.validate_images(archive, os.environ['RELEASE_SHA'])
          archive.unlink()
          PY
