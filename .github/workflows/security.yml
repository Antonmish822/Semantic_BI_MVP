name: Security regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'uv==0.9.10'
      - run: uv sync --locked --no-dev
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: node tests/chat_ui.cjs
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t semantic-bi-ci .
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-dev --no-emit-project -o "$RUNNER_TEMP/locked.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/locked.txt" --no-deps --disable-pip
