name: Deploy production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify delivery or approve a production deployment
        type: choice
        options: [verify, deploy]
        default: verify
      release_sha:
        description: Full tested main commit SHA, empty for current main
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate main revision and successful CI
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/react-web.yml/runs?head_sha=$sha&status=success" \
            --jq '.workflow_runs | length > 0' | grep -qx true
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Build production images
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
          IMAGE_PREFIX: semantic-bi-prod
        run: bash deploy/dev/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: production-images
          path: images.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-images
      - name: Deliver approved production release
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" != verify ] && [ "$OPERATION" != deploy ]; then
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/prod_key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/prod_key"
          chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/prod_key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "semantic-bi-prod-deploy@$SSH_HOST" "$OPERATION $RELEASE_SHA" < images.tar.gz
