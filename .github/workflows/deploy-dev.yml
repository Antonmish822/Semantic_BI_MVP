name: Deploy dev

on:
  workflow_run:
    workflows: [Semantic BI CI]
    branches: [dev]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Record tested revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build dev images
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: bash deploy/dev/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dev-images
          path: images.tar.gz
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dev-images
      - name: Deliver tested release
        env:
          DEPLOY_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          SSH_HOST: ${{ vars.DEV_SSH_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)"
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo 'Skipping a release superseded on dev'
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/dev_key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/dev_key"
          chmod 600 "$HOME/.ssh/dev_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/dev_key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "semantic-bi-deploy@$SSH_HOST" "deploy $RELEASE_SHA" < images.tar.gz
